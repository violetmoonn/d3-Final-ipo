<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#ffffff;
  --white:#ffffff;
  --ink:#000000;
  --gray:#6f6f6f;
  --gray-light:#9b9b9b;
  --rule:#e2e2e2;
  --tile:#f0efec;
  --bar:#eceaea;
  --sans:"Inter","Helvetica Neue",Arial,sans-serif;
  --script:"Pinyon Script","Snell Roundhand",cursive;
  --display:"Archivo Black","Arial Black","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--sans);
  background:var(--paper);
  color:var(--ink);
  line-height:1.4;
  overflow-x:hidden;
}
body.locked{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid #000;outline-offset:2px}


/* ---------- entry gate ---------- */
.gate{
  position:fixed;inset:0;z-index:100;
  background:#fff;
  display:grid;place-content:center;place-items:center;
  cursor:pointer;padding:24px;
  transition:opacity .6s ease, visibility .6s;
}
.gate.gone{opacity:0;visibility:hidden}
.gate h1{
  font-family:var(--display);
  font-weight:900;
  font-size:36px;
  letter-spacing:-.035em;
  line-height:1;
  color:#000;
  text-align:center;
  text-transform:uppercase;
  white-space:nowrap;
  user-select:none;
}
@media (min-width:640px){.gate h1{font-size:48px}}
@media (min-width:768px){.gate h1{font-size:60px}}
@media (min-width:1024px){.gate h1{font-size:72px}}
body.gated{overflow:hidden}
