/* ---------- entry gate ---------- */
.gate{
  position:fixed;inset:0;z-index:100;
  background:#fff;
  display:grid;place-content:center;place-items:center;
  cursor:pointer;padding:24px;
  transition:opacity .6s ease, visibility .6s;
}
.gate.gone{opacity:0;visibility:hidden}
.gate h1{
  font-family:var(--display);
  font-weight:900;
  font-size:36px;
  letter-spacing:-.035em;
  line-height:1;
  color:#000;
  text-align:center;
  text-transform:uppercase;
  white-space:nowrap;
  user-select:none;
}
@media (min-width:640px){.gate h1{font-size:48px}}
@media (min-width:768px){.gate h1{font-size:60px}}
@media (min-width:1024px){.gate h1{font-size:72px}}
body.gated{overflow:hidden}

/* ---------- product detail ---------- */
.pdp{max-width:1180px;margin:0 auto;padding:20px 16px 80px;width:100%}
.back{
  display:inline-block;font-size:11px;letter-spacing:.2em;color:#6f6f6f;
  text-transform:uppercase;padding:8px 0 26px;
}
.back:hover{color:#000}
.pdp-grid{display:grid;grid-template-columns:1fr;gap:32px}
.pdp-main{
  position:relative;aspect-ratio:3/4;background:#fff;border:1px solid var(--rule);overflow:hidden;
}
.pdp-main img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity .35s}
.pdp-main img.on{opacity:1}
.thumbs{display:flex;gap:10px;padding-top:14px}
.thumb{
  width:74px;aspect-ratio:3/4;border:1px solid var(--rule);background:#fff;
  padding:0;overflow:hidden;flex:none;
}
.thumb img{width:100%;height:100%;object-fit:contain}
.thumb.on{border-color:#000}
.dots{display:flex;justify-content:center;gap:10px;padding-top:14px}
.dot{width:7px;height:7px;border-radius:50%;border:0;padding:0;background:#cfcfcf;cursor:pointer}
.dot.on{background:#000}
.pdp-main{touch-action:pan-y}
@media (max-width:899px){ .thumbs{display:none} }
@media (min-width:900px){ .dots{display:none} }
.pdp-info h2{font-size:22px;letter-spacing:.02em;font-weight:400;text-transform:uppercase;padding-bottom:10px}
.pdp-price{font-size:17px;letter-spacing:.02em}
.stock{
  display:flex;align-items:center;gap:8px;font-size:10.5px;letter-spacing:.18em;
  color:#6f6f6f;text-transform:uppercase;padding-top:14px;
}
.stock i{width:6px;height:6px;border-radius:50%;background:#2e8b57;display:block}
.stock.out i{background:#b9b9b9}
.ships{font-size:10.5px;letter-spacing:.16em;color:#a0a0a0;text-transform:uppercase;padding-top:8px}
.pdp-desc{
  font-size:12px;letter-spacing:.055em;line-height:1.95;color:#4a4a4a;
  text-transform:uppercase;padding:30px 0 0;border-top:1px solid var(--rule);margin-top:26px;
}
.pdp-trust{list-style:none;padding:22px 0 0;margin-top:22px;border-top:1px solid var(--rule);display:grid;gap:8px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#6f6f6f}
.pdp-trust a{color:#111;border-bottom:1px solid #c9c9c9}
.pdp-desc h4{font-size:10.5px;letter-spacing:.2em;font-weight:400;color:#1a1a1a;padding:0 0 6px}
.pdp-desc ul{list-style:none;padding:0 0 18px;margin:0}
.pdp-desc li{position:relative;padding-left:14px}
.pdp-desc li::before{content:"";position:absolute;left:0;top:.9em;width:5px;height:1px;background:#8a8a8a}
.pdp-desc ul:last-child{padding-bottom:0}
.pdp-sizes{padding-top:38px}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches .sw{width:18px;height:18px;border-radius:50%;background:var(--c);border:1px solid rgba(0,0,0,.18);box-shadow:inset 0 0 0 2px #fff;padding:0;cursor:pointer}
.swatches .sw.on{outline:1px solid #000;outline-offset:2px}
.c-sw{margin-top:12px}
.c-sw .sw{width:13px;height:13px;box-shadow:none}
.pdp-colors{padding-top:30px}
.pdp-colors .label{display:block;font-size:10.5px;letter-spacing:.2em;color:#6f6f6f;text-transform:uppercase;padding-bottom:14px}
.pdp-colors .label b{color:#111;font-weight:400}
.pdp-sizes .label{font-size:10.5px;letter-spacing:.2em;color:#6f6f6f;text-transform:uppercase}
.pdp-sizes .row{display:flex;gap:8px;padding-top:14px;flex-wrap:wrap}
.pdp-sizes button{
  min-width:56px;padding:14px 8px;border:1px solid var(--rule);background:#fff;
  font-size:12px;letter-spacing:.12em;color:#4a4a4a;
}
.pdp-sizes button:hover{border-color:#9b9b9b}
.pdp-sizes button.on{background:#000;border-color:#000;color:#fff}
.pdp-sizes button.out{color:#b5b5b5;text-decoration:line-through;cursor:default}
.pdp-sizes button.out:hover{border-color:#e2e2e2}
.left-note{font-size:10.5px;letter-spacing:.2em;color:#6f6f6f;text-transform:uppercase;padding-top:12px;min-height:14px}
/* reserve (pay at pickup / Zelle) */
.r-alt{display:block;margin:14px auto 0;font-size:12px;letter-spacing:.14em;color:#000;border-bottom:1px solid #000;text-align:center}
.r-form{display:flex;flex-direction:column;gap:10px;max-width:330px;margin:0 auto}
.r-form input,.r-form textarea{width:100%;border:1px solid #cfcfcf;padding:12px;font:inherit;font-size:14px;letter-spacing:.02em;border-radius:0;background:#fff;color:#000}
.r-form .r-methods{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.r-form .r-methods button{border:1px solid #cfcfcf;padding:11px 6px;font-size:11px;letter-spacing:.14em}
.r-form .r-methods button.on{background:#000;color:#fff;border-color:#000}
.r-form .hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
.r-msg{font-size:11px;letter-spacing:.12em;text-align:center;line-height:1.7;color:#6f6f6f}
.r-msg.err{color:#a1271f}
.buy{
  display:block;width:100%;margin-top:30px;background:transparent;color:#000;border:1px solid #000;
  padding:13px 20px;text-align:center;font-size:11px;letter-spacing:.2em;text-transform:uppercase;transition:background .2s,color .2s;
}
.buy:hover{background:#000;color:#fff}
.bagbtn{
  display:block;width:100%;margin-top:12px;border:1px solid var(--rule);background:#fff;
  padding:16px 20px;font-size:11px;letter-spacing:.2em;color:#4a4a4a;text-transform:uppercase;
}
.bagbtn:hover{border-color:#000;color:#000}
@media (min-width:900px){
  .pdp{padding:24px 32px 90px}
  .pdp-grid{grid-template-columns:1.15fr .85fr;gap:56px}
  .pdp-info{padding-top:8px}
}

/* ---------- gallery ---------- */
.gal-wrap{max-width:1180px;margin:0 auto;padding:38px 16px 80px;width:100%}
.gal{
  display:grid;grid-template-columns:1fr;gap:12px;padding-top:26px;
}
.gal figure{margin:0;cursor:zoom-in;background:#fff;border:1px solid var(--rule);overflow:hidden}
.gal img,.gal video{display:block;width:100%;height:100%;object-fit:cover;aspect-ratio:4/5;transition:opacity .3s;background:#fff}
.gal figure:hover img,.gal figure:hover video{opacity:.85}
.gal figcaption{
  font-size:10px;letter-spacing:.16em;color:#9a9a9a;text-transform:uppercase;
  padding:10px 12px 12px;
}
.gal-empty{
  font-size:11px;letter-spacing:.18em;color:#b0b0b0;text-transform:uppercase;
  padding-top:40px;text-align:center;
}
.gal-empty.hide{display:none}
.gal figure.vid{position:relative}
.gal-lock{display:none}
body.drop-locked .gal figure.vid{cursor:pointer}
